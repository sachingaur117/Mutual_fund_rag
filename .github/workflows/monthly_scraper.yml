name: Monthly Data Refresh

on:
  schedule:
    # Run at 23:30 (UTC) on days 28, 29, 30, and 31.
    - cron: '30 23 28-31 * *'
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for pushing back

      - name: Check if it is the Last Day of the Month
        run: |
          # Only run if today is the last day of the month
          if [ "$(date -d 'tomorrow' +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not the last day of the month. Skipping run."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The scraper reads fund_id context from metadata.json or its internal list
        run: python scraper/scrape_and_index.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes to commit
          if [[ -n "$(git status --porcelain)" ]]; then
            git add vector_db/ metadata.json
            git commit -m "Automated monthly data refresh [skip ci]"
            git push origin main
          else
            echo "No changes detected in vector_db or metadata.json"
          fi
