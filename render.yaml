services:
  - type: web
    name: hdfc-rag-backend
    env: docker
    plan: free
    region: singapore # or oregon, frankfurt, ohio
    branch: main
    dockerCommand: "uvicorn backend.api:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # You must set this manually in the Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: TOP_K_RESULTS
        value: 10
      - key: CHROMA_DB_PATH
        value: ./vector_db
